name: rehearsal-prod-schema

# Répétition PRIVÉE (dépôt auto-dyali-rehearsal).
# Copie RÉELLE du schéma public de PRODUCTION, sans aucune donnée, restaurée
# dans la base locale DANS LE MÊME JOB. Aucun artefact, aucun contenu du
# schéma dans les logs, aucune valeur de secret affichée.
# Déclenchement : push sur gv5-107-prod-final UNIQUEMENT.
on:
  push:
    branches: [gv5-107-prod-final]

permissions:
  contents: read

concurrency:
  group: rehearsal-prod-schema
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------
  # Parcours NOUVEAU : aucun fournisseur e-mail (ni RESEND_API_KEY ni
  # EMAIL_FROM). La création doit réussir et le lien est émis par la RPC.
  # ---------------------------------------------------------------------
  nouveau-parcours:
    runs-on: ubuntu-latest
    env:
      SECRET_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SECRET_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      SECRET_COMBINE: ${{ secrets.REHEARSAL_GV5107 }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Les secrets peuvent être fournis sous les deux noms attendus OU
      # regroupés dans REHEARSAL_GV5107 (JSON ou deux lignes). Aucune valeur
      # n'est affichée : elles sont uniquement écrites dans $GITHUB_ENV.
      - name: Résolution des secrets de répétition (valeurs non affichées)
        run: |
          node -e '
          const fs=require("fs");
          let a=(process.env.SECRET_ACCESS_TOKEN||"").trim();
          let b=(process.env.SECRET_DB_PASSWORD||"").trim();
          const c=(process.env.SECRET_COMBINE||"").trim();
          if(c){
            let j={}; try{ j=JSON.parse(c); }catch(e){ j={}; }
            const g=(...ks)=>{for(const k of ks){const v=j[k];if(typeof v==="string"&&v.trim())return v.trim();}return "";};
            a=a||g("SUPABASE_ACCESS_TOKEN","supabase_access_token","access_token","token");
            b=b||g("PROD_DB_PASSWORD","prod_db_password","db_password","password");
            if(!a && Object.keys(j).length===0) a=c;
          }
          if(!a){
            console.error("::error::SUPABASE_ACCESS_TOKEN introuvable (REHEARSAL_GV5107 sert de repli) — valeurs non affichées");
            process.exit(2);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,"SUPABASE_ACCESS_TOKEN="+a+"\nPROD_DB_PASSWORD="+b+"\n");
          console.log("Secrets résolus (mot de passe DB "+(b?"présent":"optionnel : login CLI par jeton")+"), valeurs non affichées");
          '

      - name: Contrôle des secrets (noms seulement) et absence de fournisseur e-mail
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN absent"; exit 2; }
          [ -z "${RESEND_API_KEY:-}" ] || { echo "::error::RESEND_API_KEY ne doit pas être défini dans ce job"; exit 2; }
          [ -z "${EMAIL_FROM:-}" ] || { echo "::error::EMAIL_FROM ne doit pas être défini dans ce job"; exit 2; }
          echo "Secrets requis présents ; aucun secret e-mail défini (valeurs non affichées)"

      - name: Dump du schéma public de PRODUCTION (sans données)
        run: |
          set +e
          if [ -n "$PROD_DB_PASSWORD" ]; then
            supabase db dump --remote=nxmsqqoflskfajqrqddw --schema public \
              --password "$PROD_DB_PASSWORD" -f /tmp/prod_schema.sql >/tmp/dump.log 2>&1
          else
            supabase db dump --remote=nxmsqqoflskfajqrqddw --schema public \
              -f /tmp/prod_schema.sql >/tmp/dump.log 2>&1
          fi
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::dump du schéma production échoué (code $rc), détail non affiché"
            exit "$rc"
          fi
          echo "dump produit : $(wc -c < /tmp/prod_schema.sql) octets (contenu non affiché)"

      - name: Démarrer Supabase local sans les migrations du dépôt
        run: |
          set +e
          mv supabase/migrations supabase/migrations.skip
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql supabase/seed.sql.skip; fi
          supabase start >/tmp/start.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::supabase start échoué (code $rc), détail non affiché"
            exit "$rc"
          fi
          mv supabase/migrations.skip supabase/migrations
          if [ -f supabase/seed.sql.skip ]; then mv supabase/seed.sql.skip supabase/seed.sql; fi

      - name: Restaurer le schéma production dans la base locale
        run: |
          npm ci >/dev/null 2>&1
          node scripts/sql-split.mjs /tmp/prod_schema.sql /tmp/sql-prod-schema >/tmp/split.log 2>&1 || {
            echo "::error::découpage du dump échoué (détail non affiché)"; exit 1; }
          i=0
          for stmt in /tmp/sql-prod-schema/*.sql; do
            i=$((i+1))
            supabase db query --local --file="$stmt" --yes >/tmp/stmt.log 2>&1 || {
              code=$(grep -oE '"code"[[:space:]]*:[[:space:]]*"[0-9A-Z]{5}"' /tmp/stmt.log | head -1 | grep -oE '[0-9A-Z]{5}')
              echo "::error::restauration échouée instruction #$i sqlstate=${code:-inconnu} (contenu non affiché)"; exit 1; }
          done
          echo "restauration du schéma OK"

      - name: Appliquer les 7 migrations correctives (deux passages)
        run: |
          for passe in 1 2; do
            for f in 20261125100000_prod_minimal_invitations.sql \
                     20261125101000_prod_minimal_identity_v2.sql \
                     20261125102000_prod_minimal_identity_health.sql \
                     20261125102500_prod_minimal_admin_columns.sql \
                     20261125103000_prod_minimal_admin_fields.sql \
                     20261125104000_prod_minimal_onboard_trigger_fix.sql \
                     20261125106000_prod_minimal_activation_link.sql; do
              d="/tmp/sql-$f"
              node scripts/sql-split.mjs "supabase/migrations/$f" "$d" >/dev/null 2>&1
              for stmt in "$d"/*.sql; do
                supabase db query --local --file="$stmt" --yes >/tmp/stmt.log 2>&1 || {
                  echo "::error::migration $f (passe $passe) échouée (détail non affiché)"; exit 1; }
              done
            done
          done
          echo "7 migrations × 2 passes OK"

      - name: Contrôle des objets, du diagnostic et des droits (sans contenu de schéma)
        run: |
          supabase db query --local --read-only "select count(*)::int as objets_requis from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('admin_identity_v2_health','admin_check_identity_available','admin_onboard_tenant_v2','admin_issue_activation_link','get_my_profile','get_my_security_state','resolve_login_email','must_change_password','my_permissions','my_features','has_feature','hash_invitation_token');"
          supabase db query --local --read-only "select bool_and(prosecdef) as tous_security_definer, bool_and('authenticated' = any(proacl::text[])) as droits_authenticated from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname='admin_identity_v2_health';"
          supabase db query --local --read-only "select count(*)::int as policies_invitation from pg_policy p join pg_class c on c.oid=p.polrelid join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relname in ('invitations','invitation_events');"

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Démarrer le front de la branche contre la copie
        run: |
          supabase status -o env >/tmp/status.env
          node -e '
          const fs=require("fs");const raw=fs.readFileSync("/tmp/status.env","utf8");const p={};
          for(const l of raw.split("\n")){const m=l.match(/^([A-Z0-9_]+)=(.*)$/);if(m)p[m[1]]=m[2].replace(/^"|"$/g,"")}
          const get=(...n)=>{for(const k of n)if(p[k])return p[k];return ""};
          const v={SUPABASE_URL:get("SUPABASE_URL","API_EXTERNAL_URL","API_URL"),SUPABASE_ANON_KEY:get("SUPABASE_ANON_KEY","ANON_KEY"),SUPABASE_SERVICE_ROLE_KEY:get("SUPABASE_SERVICE_ROLE_KEY","SERVICE_ROLE_KEY")};
          fs.writeFileSync("/tmp/norm.env",Object.entries(v).map(([k,x])=>`${k}=${x}`).join("\n")+"\n");
          '
          set -a; . /tmp/norm.env; set +a
          cat /tmp/norm.env >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.local
          npm run dev -- --hostname 127.0.0.1 --port 3000 >/tmp/next.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/connexion/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::front non démarré (détail non affiché)"; exit 1

      - name: Parcours complet sans fournisseur e-mail
        run: |
          set +e
          node scripts/test-rehearsal.mjs >/tmp/rehearsal.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::parcours nouveau échoué (détail dans le résumé ci-dessous)"
            grep -E 'REHEARSAL_FAILED|"nom"|"ok"' /tmp/rehearsal.log | tail -40
            exit "$rc"
          fi
          grep -E '"etapes"|"ok"|"nom"' /tmp/rehearsal.log | tail -40

  # ---------------------------------------------------------------------
  # Ancien parcours : FRONT de main (81ca143) + EF onboard-tenant de main.
  # Compatibilité ascendante après les 7 migrations.
  # ---------------------------------------------------------------------
  ancien-parcours:
    runs-on: ubuntu-latest
    env:
      SECRET_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SECRET_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
      SECRET_COMBINE: ${{ secrets.REHEARSAL_GV5107 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Même résolution que dans l'autre job, sans affichage des valeurs.
      - name: Résolution des secrets de répétition (valeurs non affichées)
        run: |
          node -e '
          const fs=require("fs");
          let a=(process.env.SECRET_ACCESS_TOKEN||"").trim();
          let b=(process.env.SECRET_DB_PASSWORD||"").trim();
          const c=(process.env.SECRET_COMBINE||"").trim();
          if(c){
            let j={}; try{ j=JSON.parse(c); }catch(e){ j={}; }
            const g=(...ks)=>{for(const k of ks){const v=j[k];if(typeof v==="string"&&v.trim())return v.trim();}return "";};
            a=a||g("SUPABASE_ACCESS_TOKEN","supabase_access_token","access_token","token");
            b=b||g("PROD_DB_PASSWORD","prod_db_password","db_password","password");
            if(!a && Object.keys(j).length===0) a=c;
          }
          if(!a){
            console.error("::error::SUPABASE_ACCESS_TOKEN introuvable (REHEARSAL_GV5107 sert de repli) — valeurs non affichées");
            process.exit(2);
          }
          fs.appendFileSync(process.env.GITHUB_ENV,"SUPABASE_ACCESS_TOKEN="+a+"\nPROD_DB_PASSWORD="+b+"\n");
          console.log("Secrets résolus (mot de passe DB "+(b?"présent":"optionnel : login CLI par jeton")+"), valeurs non affichées");
          '

      - name: Contrôle des secrets (noms seulement)
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::SUPABASE_ACCESS_TOKEN absent"; exit 2; }
          echo "Secrets requis présents (valeurs non affichées)"

      - name: Reprendre le front et l'EF de main (versions déployées)
        run: |
          git checkout origin/main -- src supabase/functions
          echo "front et EF remplacés par ceux de main ($(git rev-parse --short origin/main))"

      - name: Dump du schéma public de PRODUCTION (sans données)
        run: |
          set +e
          if [ -n "$PROD_DB_PASSWORD" ]; then
            supabase db dump --remote=nxmsqqoflskfajqrqddw --schema public \
              --password "$PROD_DB_PASSWORD" -f /tmp/prod_schema.sql >/tmp/dump.log 2>&1
          else
            supabase db dump --remote=nxmsqqoflskfajqrqddw --schema public \
              -f /tmp/prod_schema.sql >/tmp/dump.log 2>&1
          fi
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::dump du schéma production échoué (code $rc), détail non affiché"
            exit "$rc"
          fi
          echo "dump produit : $(wc -c < /tmp/prod_schema.sql) octets (contenu non affiché)"

      - name: Démarrer Supabase local sans les migrations du dépôt
        run: |
          set +e
          mv supabase/migrations supabase/migrations.skip
          if [ -f supabase/seed.sql ]; then mv supabase/seed.sql supabase/seed.sql.skip; fi
          supabase start >/tmp/start.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::supabase start échoué (code $rc), détail non affiché"
            exit "$rc"
          fi
          mv supabase/migrations.skip supabase/migrations
          if [ -f supabase/seed.sql.skip ]; then mv supabase/seed.sql.skip supabase/seed.sql; fi

      - name: Restaurer le schéma production dans la base locale
        run: |
          npm ci >/dev/null 2>&1
          node scripts/sql-split.mjs /tmp/prod_schema.sql /tmp/sql-prod-schema >/tmp/split.log 2>&1 || {
            echo "::error::découpage du dump échoué (détail non affiché)"; exit 1; }
          i=0
          for stmt in /tmp/sql-prod-schema/*.sql; do
            i=$((i+1))
            supabase db query --local --file="$stmt" --yes >/tmp/stmt.log 2>&1 || {
              code=$(grep -oE '"code"[[:space:]]*:[[:space:]]*"[0-9A-Z]{5}"' /tmp/stmt.log | head -1 | grep -oE '[0-9A-Z]{5}')
              echo "::error::restauration échouée instruction #$i sqlstate=${code:-inconnu} (contenu non affiché)"; exit 1; }
          done
          echo "restauration du schéma OK"

      - name: Appliquer les 7 migrations correctives (deux passages)
        run: |
          for passe in 1 2; do
            for f in 20261125100000_prod_minimal_invitations.sql \
                     20261125101000_prod_minimal_identity_v2.sql \
                     20261125102000_prod_minimal_identity_health.sql \
                     20261125102500_prod_minimal_admin_columns.sql \
                     20261125103000_prod_minimal_admin_fields.sql \
                     20261125104000_prod_minimal_onboard_trigger_fix.sql \
                     20261125106000_prod_minimal_activation_link.sql; do
              d="/tmp/sql-$f"
              node scripts/sql-split.mjs "supabase/migrations/$f" "$d" >/dev/null 2>&1
              for stmt in "$d"/*.sql; do
                supabase db query --local --file="$stmt" --yes >/tmp/stmt.log 2>&1 || {
                  echo "::error::migration $f (passe $passe) échouée (détail non affiché)"; exit 1; }
              done
            done
          done
          echo "7 migrations × 2 passes OK"

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Démarrer le front de main contre la copie
        run: |
          supabase status -o env >/tmp/status.env
          node -e '
          const fs=require("fs");const raw=fs.readFileSync("/tmp/status.env","utf8");const p={};
          for(const l of raw.split("\n")){const m=l.match(/^([A-Z0-9_]+)=(.*)$/);if(m)p[m[1]]=m[2].replace(/^"|"$/g,"")}
          const get=(...n)=>{for(const k of n)if(p[k])return p[k];return ""};
          const v={SUPABASE_URL:get("SUPABASE_URL","API_EXTERNAL_URL","API_URL"),SUPABASE_ANON_KEY:get("SUPABASE_ANON_KEY","ANON_KEY"),SUPABASE_SERVICE_ROLE_KEY:get("SUPABASE_SERVICE_ROLE_KEY","SERVICE_ROLE_KEY")};
          fs.writeFileSync("/tmp/norm.env",Object.entries(v).map(([k,x])=>`${k}=${x}`).join("\n")+"\n");
          '
          set -a; . /tmp/norm.env; set +a
          cat /tmp/norm.env >> "$GITHUB_ENV"
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env.local
          npm run dev -- --hostname 127.0.0.1 --port 3000 >/tmp/next.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:3000/connexion/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::front de main non démarré (détail non affiché)"; exit 1

      - name: Ancien parcours (compatibilité ascendante)
        run: |
          set +e
          node scripts/test-ancien-parcours.mjs >/tmp/ancien.log 2>&1
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::ancien parcours échoué (détail dans le résumé ci-dessous)"
            grep -E 'ANCIEN_PARCOURS_FAILED|"nom"|"ok"' /tmp/ancien.log | tail -40
            exit "$rc"
          fi
          grep -E '"etapes"|"ok"|"nom"' /tmp/ancien.log | tail -40
