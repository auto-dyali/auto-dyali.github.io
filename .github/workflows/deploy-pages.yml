name: Deploy AUTO DYALI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests (CRM + onboarding)
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build static site
        env:
          NEXT_PUBLIC_SITE_BASE_PATH: ""
          NEXT_PUBLIC_SUPABASE_URL: https://nxmsqqoflskfajqrqddw.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ugGsts0KUOh1VBmYAla5hA_ZXNjZ4bT
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
